name: Update native GitHub profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate SVG cards from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Debanjan-Mondal
        run: python3 scripts/generate_stats.py

      - name: Commit updated cards
        run: |
          if [[ -n "$(git status --porcelain assets/*.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/*.svg
            git commit -m "chore: update GitHub profile stats"
            git push
          else
            echo "Stats are unchanged."
          fi
